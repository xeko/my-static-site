<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#x691C;&#x7D22; - 勤怠管理システム</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;margin:0;background:#f8fafc;color:#1e293b;line-height:1.6}
.wpss-page{max-width:860px;margin:0 auto;padding:40px 20px}
.wpss-page a.back{color:#2563eb;text-decoration:none;font-size:14px}
h1{font-size:22px;margin:12px 0 24px}
.wpss-box{position:relative;margin-bottom:24px}
.wpss-box input{width:100%;padding:14px 52px 14px 18px;font-size:17px;border:2px solid #cbd5e1;border-radius:8px;outline:none}
.wpss-box input:focus{border-color:#2563eb}
.wpss-box button{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:20px;color:#2563eb}
[data-wpss-suggest]{position:absolute;z-index:99;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:0 0 8px 8px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
[data-wpss-suggest] ul{list-style:none;margin:0;padding:6px 0}
[data-wpss-suggest] li a{display:block;padding:10px 18px;color:#1e293b;text-decoration:none;font-size:15px}
[data-wpss-suggest] li a:hover{background:#f1f5f9}
.wpss-no-sug{padding:12px 18px;color:#64748b;font-size:14px}
.wpss-count{color:#64748b;font-size:14px;margin-bottom:18px}
.wpss-list{list-style:none;padding:0;margin:0}
.wpss-item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px}
.wpss-item:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.wpss-inner{display:flex;gap:16px;padding:18px 20px;align-items:flex-start}
.wpss-thumb{width:80px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0}
.wpss-body{flex:1;min-width:0}
.wpss-body h3{font-size:16px;margin:0 0 6px}
.wpss-body h3 a{color:#2563eb;text-decoration:none}
.wpss-body h3 a:hover{text-decoration:underline}
.wpss-meta{font-size:12px;color:#64748b;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wpss-tags span{background:#f1f5f9;border-radius:3px;padding:2px 6px;font-size:11px}
.wpss-snip{font-size:14px;color:#475569;margin:0}
mark{background:#fef08a;color:inherit;padding:1px 2px;border-radius:2px}
.wpss-empty{text-align:center;padding:60px 20px;color:#64748b}
.wpss-pages{display:flex;gap:8px;margin-top:28px;flex-wrap:wrap}
.wpss-pg{display:inline-block;padding:8px 14px;border-radius:6px;text-decoration:none;border:1px solid #cbd5e1;color:#334155;font-size:14px}
.wpss-pg.cur{background:#2563eb;color:#fff;border-color:#2563eb}
.wpss-pg:hover:not(.cur){background:#f1f5f9}
.wpss-prompt{color:#94a3b8;text-align:center;padding:40px 0}
@media(max-width:600px){.wpss-inner{flex-direction:column}.wpss-thumb{width:100%;height:150px}}
</style>
</head>
<body>
<div class="wpss-page">
    <a class="back" href="https://wp3.cubelab.info/">← トップページに戻る</a>
    <h1>&#x30B5;&#x30A4;&#x30C8;&#x5185;&#x691C;&#x7D22;</h1>
    <div class="wpss-box">
        <input type="search" data-wpss-search placeholder="&#x30AD;&#x30FC;&#x30EF;&#x30FC;&#x30C9;&#x3092;&#x5165;&#x529B;..." autocomplete="off">
        <button type="button" aria-label="&#x691C;&#x7D22;">&#x1F50D;</button>
        <div data-wpss-suggest></div>
    </div>
    <div data-wpss-results>
        <p class="wpss-prompt">&#x30AD;&#x30FC;&#x30EF;&#x30FC;&#x30C9;&#x3092;&#x5165;&#x529B;&#x3057;&#x3066;&#x691C;&#x7D22;&#x3057;&#x3066;&#x304F;&#x3060;&#x3055;&#x3044;</p>
    </div>
</div>
<script src="https://wp3.cubelab.info/static-search.js" data-root="https://wp3.cubelab.info/" data-index="https://wp3.cubelab.info/search-index.json" defer></script>
</body>
</html>
